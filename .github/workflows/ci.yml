# This Is Fine — multi-OS engineering CI
#
# Product containment CI for *consumer* repos lives under ci/github-actions/.
# This workflow validates the tif codebase itself on every PR/push.

name: ci

on:
  push:
    branches: [main, master, feat/**]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: tif-${{ matrix.os }}

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace --all-features

      - name: Build release binary
        run: cargo build --release -p tif

      - name: Smoke CLI
        shell: bash
        run: |
          set -euo pipefail
          BIN=target/release/tif
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            BIN=target/release/tif.exe
          fi
          "$BIN" --version
          "$BIN" init --force
          "$BIN" policy resolve --task "smoke test containment" --json | head -c 200

  # AI field-validation / user-testing battery (docs/USER_TESTING.md).
  # Tiers A–D; evidence pack uploaded for V1 readiness.
  user-testing:
    name: user-testing (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: tif-e2e-${{ matrix.os }}

      - name: Build tif
        run: cargo build -p tif

      - name: Run tif-e2e battery + evidence pack
        shell: bash
        run: |
          set -euo pipefail
          OUT="evidence/user-testing/ci-${{ matrix.os }}-${{ github.run_id }}"
          mkdir -p "$OUT"
          set +e
          cargo test -p tif-e2e --all-targets -- --nocapture 2>&1 | tee "$OUT/cargo-test.log"
          CODE=${PIPESTATUS[0]}
          set -e
          if command -v python3 >/dev/null 2>&1; then
            python3 scripts/user-test/write_evidence.py "$OUT" "$CODE"
          elif command -v python >/dev/null 2>&1; then
            python scripts/user-test/write_evidence.py "$OUT" "$CODE"
          fi
          if [[ "$CODE" -eq 0 ]]; then echo Pass >"$OUT/STATUS"; else echo Fail >"$OUT/STATUS"; fi
          exit "$CODE"

      - name: Upload evidence pack
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: user-testing-evidence-${{ matrix.os }}
          path: evidence/user-testing/
          if-no-files-found: warn
          retention-days: 30
