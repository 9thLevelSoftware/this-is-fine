version = 1
enabled = true
default_fire_level = 3

[verification]
commands = ["echo tif-ok"]
discover = false

[simplicity.limits]
new_runtime_dependencies = 0


[approval]
# Path-based gating under test (B07). Global require_firebreak_approval stays false
# so approval is driven by sensitive_paths, not a blanket switch.
sensitive_paths = ["src/auth/**"]
require_firebreak_approval = false
auto_apply_firebreak = true

[audit]
tier = "redacted"
max_age_days = 90
max_size_mb = 256

[rollback]
max_days = 7
successful_commits = 3

[ci]
on_violation = "fail"
allow_write = false
allow_pr = false

[pressure]
include_baseline = true

[[reviewers]]
id = "e2e-mock"
provider = "mock"
model = "fixture"
allow_source_egress = false
priority = 100
