[package]
name = "tif-e2e"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "AI field-validation / user-testing harness for This Is Fine"
publish = false

[lib]
name = "tif_e2e"
path = "src/lib.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
walkdir = { workspace = true }
# Used for pure safety asserts (A01 rank, A06 egress, A09 credentials) without live CLI.
tif-core = { path = "../tif-core" }

# Note: `tif` is bin-only; e2e invokes it via `cargo build -p tif` in ensure_tif_built().
