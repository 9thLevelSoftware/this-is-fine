[workspace]
resolver = "2"
members = ["crates/tif-core", "crates/tif", "crates/tif-e2e"]
default-members = ["crates/tif"]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/9thLevelSoftware/this-is-fine"
authors = ["This Is Fine Contributors"]
rust-version = "1.75"

[workspace.dependencies]
tif-core = { path = "crates/tif-core", version = "0.1.1" }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "4", features = ["derive", "env"] }
directories = "5"
globset = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
toml = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"
tempfile = "3"
ureq = { version = "2", default-features = true, features = ["json"] }
